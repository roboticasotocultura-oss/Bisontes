<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de bisontes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#1f1f1e;--muted:#6b6b68;--border:#e2e2de;--ok:#3B6D11;--bad:#A32D2D;--accent:#185FA5;--sun:#BA7517}
@media (prefers-color-scheme: dark){:root{--bg:#1c1c1b;--card:#262624;--text:#eeeeea;--muted:#a3a39e;--border:#3a3a37;--ok:#97C459;--bad:#F09595;--accent:#85B7EB;--sun:#FAC775}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;height:100vh}
#side{width:310px;flex:0 0 310px;border-right:1px solid var(--border);background:var(--card);overflow:auto;padding:14px}
#map{position:absolute;inset:0;left:310px}
h1{font-size:18px;font-weight:500;margin:0 0 12px}
h2{font-size:14px;font-weight:500;margin:16px 0 8px;color:var(--muted)}
.btn{font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:8px;cursor:pointer;margin:0 6px 6px 0}
.btn:hover{border-color:var(--accent)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.cow{padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.cow:hover,.cow.sel{border-color:var(--accent)}
.cow.alert{border-color:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:8px}
.cow.alert .dot{background:var(--bad)}
.card{border:1px solid var(--border);border-radius:10px;padding:12px;font-size:13px}
.card p{margin:6px 0;display:flex;justify-content:space-between;gap:8px}
.k{color:var(--muted)}
.bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:2px 0 8px}
.bar i{display:block;height:100%}
.warn{color:var(--bad);font-weight:500}
.log{font-size:12px;color:var(--muted);line-height:1.6}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
.pin{width:32px;height:32px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.alert{background:var(--bad)}
.pin.sel{outline:3px solid var(--accent)}
.banner{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:999}
.offline{position:fixed;top:10px;right:10px;background:var(--bad);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;display:none;z-index:999}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>Control de bisontes</h1>
    <button class="btn" id="btnDraw">Dibujar zona</button>
    <button class="btn" id="btnClose" disabled>Cerrar zona</button>
    <button class="btn" id="btnClear">Borrar zona</button>
    <p class="hint" id="hint">Pulsa "Dibujar zona" y marca los vértices en el mapa.</p>

    <h2>Bisonte seleccionado</h2>
    <div id="detail" class="card"><span class="k">Pincha un bisonte en el mapa o en la lista.</span></div>
    <button class="btn" id="btnEscape" style="margin-top:8px">Simular salida de zona</button>

    <h2>Últimas 24 h</h2>
    <div id="stats" class="card"><span class="k">Selecciona un bisonte.</span></div>

    <h2>Bisontes</h2>
    <div id="list"></div>

    <h2>Eventos</h2>
    <div id="log" class="log">Sin eventos todavía.</div>
  </div>
  <div id="map"></div>
</div>
<div id="banner" class="banner"></div>
<div id="offline" class="offline">Sin conexión con el servidor</div>

<script>
const CENTER = [40.752802421187845, -3.8113048447402043];
const map = L.map('map').setView(CENTER, 16);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19, attribution: 'Imágenes © Esri'}).addTo(map);
setTimeout(() => map.invalidateSize(), 100);
window.addEventListener('resize', () => map.invalidateSize());

const $ = id => document.getElementById(id);
const api = async (url, opt) => {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
};

let animales = [], zona = null, zonaLayer = null, zonaKey = '';
let selected = null, lastStats = 0;
let drawing = false, drawPts = [], drawLine = null;
const markers = {}, trails = {}, prevDentro = {};
const logs = [];

function estaDentro(lat, lng, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [yi, xi] = poly[i], [yj, xj] = poly[j];
    if ((yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function realHour() { const d = new Date(); return d.getHours() + d.getMinutes() / 60; }
function sunFactor(h) { const s = Math.sin(Math.PI * (h - 6) / 14); return s > 0 ? s : 0; }

function estadoCarga(bat) {
  if (bat >= 99.5) return 'Llena';
  return sunFactor(realHour()) > 0.05 ? '<span style="color:var(--sun)">Cargando (sol)</span>' : 'Descargando (noche)';
}

function addLog(m) {
  const t = new Date().toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
  logs.unshift(t + '  ' + m);
  logs.length = Math.min(logs.length, 8);
  $('log').innerHTML = logs.join('<br>');
}

function banner(m) {
  const b = $('banner');
  b.textContent = m;
  b.style.display = 'block';
  clearTimeout(banner.t);
  banner.t = setTimeout(() => b.style.display = 'none', 4000);
}

const fueraDeZona = a => zona && a.dentro === 0;

function pinIcon(a) {
  const cls = ['pin', fueraDeZona(a) ? 'alert' : '', selected === a.animal ? 'sel' : ''].join(' ');
  return L.divIcon({className: '', html: '<div class="' + cls + '">' + a.animal + '</div>', iconSize: [32, 32], iconAnchor: [16, 16]});
}

function drawZona() {
  if (zonaLayer) { map.removeLayer(zonaLayer); zonaLayer = null; }
  if (zona) zonaLayer = L.polygon(zona, {color: '#185FA5', weight: 2, fillOpacity: 0.12}).addTo(map);
}

function renderList() {
  $('list').innerHTML = animales.map(a =>
    '<div class="cow ' + (fueraDeZona(a) ? 'alert' : '') + ' ' + (a.animal === selected ? 'sel' : '') + '" onclick="select(' + a.animal + ')">' +
    '<span><span class="dot"></span>Bisonte ' + a.animal + '</span>' +
    '<span style="font-size:12px;color:var(--muted)">' + Math.round(a.bateria) + '%</span></div>'
  ).join('') || '<span class="k">Sin bisontes todavía.</span>';
}

function renderDetail() {
  const a = animales.find(x => x.animal === selected);
  if (!a) { $('detail').innerHTML = '<span class="k">Pincha un bisonte en el mapa o en la lista.</span>'; return; }
  const bat = Math.round(a.bateria);
  const zonaTxt = !zona ? 'Sin zona definida' : (a.dentro ? 'Dentro de la zona' : '<span class="warn">Fuera de la zona</span>');
  $('detail').innerHTML =
    '<p><span class="k">Animal</span><span>Bisonte ' + a.animal + '</span></p>' +
    '<p><span class="k">Batería</span><span>' + bat + '%</span></p>' +
    '<div class="bar"><i style="width:' + bat + '%;background:' + (bat < 25 ? 'var(--bad)' : 'var(--ok)') + '"></i></div>' +
    '<p><span class="k">Carga</span><span>' + estadoCarga(a.bateria) + '</span></p>' +
    '<p><span class="k">Temperatura</span><span>' + Number(a.temperatura).toFixed(1) + ' °C</span></p>' +
    '<p><span class="k">Actividad</span><span>' + a.actividad + '</span></p>' +
    '<p><span class="k">Latitud</span><span>' + a.lat.toFixed(6) + '</span></p>' +
    '<p><span class="k">Longitud</span><span>' + a.lng.toFixed(6) + '</span></p>' +
    '<p><span class="k">Zona</span><span>' + zonaTxt + '</span></p>' +
    '<p><span class="k">Vibración</span><span>' + (fueraDeZona(a) ? '<span class="warn">Activa</span>' : 'No') + '</span></p>' +
    '<p><span class="k">Última lectura</span><span>' + new Date(a.ts).toLocaleTimeString('es-ES') + '</span></p>';
}

function fmtTiempo(min) {
  const m = Math.round(min || 0);
  return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min';
}

function renderStats(s) {
  const act = Object.entries(s.actividad).map(([k, v]) => k + ' ' + v).join(', ') || '-';
  $('stats').innerHTML =
    '<p><span class="k">Distancia</span><span>' + s.distanciaKm + ' km</span></p>' +
    '<p><span class="k">Tiempo dentro</span><span>' + s.minutosDentro + ' min</span></p>' +
    '<p><span class="k">Tiempo fuera</span><span>' + s.minutosFuera + ' min</span></p>' +
    '<p><span class="k">Batería mín / máx</span><span>' + (s.bateriaMin == null ? '-' : Math.round(s.bateriaMin) + '% / ' + Math.round(s.bateriaMax) + '%') + '</span></p>' +
    '<p><span class="k">Temperatura media</span><span>' + (s.temperaturaMedia ?? '-') + ' °C</span></p>' +
    '<p><span class="k">Tiempo en funcionamiento</span><span>' + fmtTiempo(s.minutosFuncionando) + '</span></p>' +
    '<p><span class="k">Actividad</span><span style="text-align:right">' + act + '</span></p>';
}

async function loadTrailAndStats(id) {
  const [h, s] = await Promise.all([
    api('/api/historial?animal=' + id + '&horas=24'),
    api('/api/estadisticas?animal=' + id + '&horas=24')
  ]);
  if (trails[id]) map.removeLayer(trails[id]);
  trails[id] = L.polyline(h.map(r => [r.lat, r.lng]), {color: '#E8B04B', weight: 3, opacity: 0.85}).addTo(map);
  renderStats(s);
}

function select(id) {
  selected = id;
  Object.keys(trails).forEach(k => {
    if (Number(k) !== id) { map.removeLayer(trails[k]); delete trails[k]; }
  });
  lastStats = Date.now();
  loadTrailAndStats(id).catch(() => {});
  const a = animales.find(x => x.animal === id);
  if (a) map.panTo([a.lat, a.lng]);
  renderList();
  renderDetail();
}

async function poll() {
  try {
    const d = await api('/api/estado');
    $('offline').style.display = 'none';
    animales = d.animales;

    const key = JSON.stringify(d.zona);
    if (key !== zonaKey) { zonaKey = key; zona = d.zona; drawZona(); }

    animales.forEach(a => {
      const prev = prevDentro[a.animal];
      if (zona && prev === 1 && a.dentro === 0) {
        addLog('Bisonte ' + a.animal + ' ha salido de la zona. Vibración activada');
        banner('Bisonte ' + a.animal + ' ha salido de la zona');
      }
      if (zona && prev === 0 && a.dentro === 1) addLog('Bisonte ' + a.animal + ' ha vuelto a la zona');
      prevDentro[a.animal] = a.dentro;

      if (!markers[a.animal]) {
        markers[a.animal] = L.marker([a.lat, a.lng], {icon: pinIcon(a)}).addTo(map);
        markers[a.animal].on('click', () => select(a.animal));
      }
      markers[a.animal].setLatLng([a.lat, a.lng]).setIcon(pinIcon(a));
    });

    renderList();
    renderDetail();
    if (selected && Date.now() - lastStats > 10000) {
      lastStats = Date.now();
      loadTrailAndStats(selected).catch(() => {});
    }
  } catch (e) {
    $('offline').style.display = 'block';
  }
}
setInterval(poll, 2000);
poll();

// ----- Zona: se guarda en el servidor -----
$('btnDraw').onclick = () => {
  drawing = !drawing;
  drawPts = [];
  if (drawLine) { map.removeLayer(drawLine); drawLine = null; }
  $('btnDraw').classList.toggle('on', drawing);
  $('btnClose').disabled = !drawing;
  $('hint').textContent = drawing
    ? 'Marca los vértices en el mapa y pulsa "Cerrar zona" (mínimo 3).'
    : 'Pulsa "Dibujar zona" y marca los vértices en el mapa.';
};

map.on('click', e => {
  if (!drawing) return;
  drawPts.push([e.latlng.lat, e.latlng.lng]);
  if (drawLine) map.removeLayer(drawLine);
  drawLine = L.polyline(drawPts, {color: '#185FA5', dashArray: '4 4'}).addTo(map);
});

$('btnClose').onclick = async () => {
  if (drawPts.length < 3) { banner('Necesitas al menos 3 vértices'); return; }
  try {
    await api('/api/zona', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({puntos: drawPts})});
    addLog('Zona guardada en el servidor');
  } catch (e) { banner('No se pudo guardar la zona'); }
  if (drawLine) { map.removeLayer(drawLine); drawLine = null; }
  drawing = false; drawPts = [];
  $('btnDraw').classList.remove('on');
  $('btnClose').disabled = true;
  $('hint').textContent = 'Zona guardada. Pulsa "Dibujar zona" para cambiarla.';
  poll();
};

$('btnClear').onclick = async () => {
  try { await api('/api/zona', {method: 'DELETE'}); addLog('Zona borrada'); } catch (e) { banner('No se pudo borrar la zona'); }
  poll();
};

$('btnEscape').onclick = async () => {
  if (!selected) { banner('Selecciona un bisonte primero'); return; }
  if (!zona) { banner('Define primero una zona'); return; }
  try { await api('/api/simular-salida/' + selected, {method: 'POST'}); }
  catch (e) { banner('Solo se pueden simular salidas de los bisontes del simulador'); }
};

// ----- Limpieza de marcadores al cambiar animal (uso futuro) -----
function renderAllPins() { animales.forEach(a => markers[a.animal] && markers[a.animal].setIcon(pinIcon(a))); }
</script>
</body>
</html>
